name: Release (build & publish images)

# Publish only from main and version tags — not from feature branches or PRs.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # 1) Build every service jar ONCE (native, with unit tests). Jars are arch-independent, so a
  #    single build feeds all target architectures downstream.
  build-jars:
    name: Build service jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (with tests)
        run: mvn -B -ntp package

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: '*/target/*.jar'
          retention-days: 1

  # 2) For each service: build a multi-arch image from the prebuilt jar, push to GHCR with
  #    SBOM + provenance attestations, sign it keylessly with cosign, and scan it with Trivy.
  publish:
    name: Publish ${{ matrix.service }}
    needs: build-jars
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push images to GHCR
      id-token: write         # keyless cosign signing (OIDC)
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - patient-service
          - billing-service
          - notification-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Stage build context
        run: |
          mkdir -p stage
          cp ${{ matrix.service }}/target/*.jar stage/app.jar
          cp docker/release.Dockerfile stage/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=Patient Management System - ${{ matrix.service }}

      - name: Build & push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: stage
          file: stage/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan image (Trivy, table output)
        uses: aquasecurity/trivy-action@v0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Report-only: base-image CVEs shouldn't block a release. Tighten to fail on CRITICAL
          # once you triage the base image, or wire SARIF into code scanning (needs GH Advanced
          # Security on a private repo).
          exit-code: '0'

      - name: Scan image (Trivy, SARIF artifact)
        uses: aquasecurity/trivy-action@v0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          ignore-unfixed: true

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          if-no-files-found: ignore
          retention-days: 7
