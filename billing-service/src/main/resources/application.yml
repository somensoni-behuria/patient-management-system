server:
  port: 4001
  shutdown: graceful

spring:
  application:
    name: billing-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

# gRPC server (internal). Reached by patient-service on this port.
grpc:
  server:
    port: 9005

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    net.devh.boot.grpc: INFO
